    function draw(){const p=Number(fields.page.value);ctx.clearRect(0,0,1080,1440);if(p===0)drawCover();else if(p===1)drawBar();else drawMenu(p-2)}
    function preload(){let pending=0;for(const item of data){if(!item.image||images.has(item.image))continue;pending+=1;const img=new Image();img.crossOrigin='anonymous';const done=()=>{pending-=1;if(pending===0)document.body.dataset.ready='1';draw()};img.onload=()=>{images.set(item.image,img);done()};img.onerror=done;img.src=item.image}if(pending===0)document.body.dataset.ready='1'}
    function download(p){fields.page.value=String(p);draw();const a=document.createElement('a');a.download=`${fields.filename.value}-${String(p+1).padStart(2,'0')}.png`;a.href=canvas.toDataURL('image/png');a.click()}
    $('apply').onclick=()=>{try{data=JSON.parse(fields.data.value);fields.tapCount.value=String(data.length);images.clear();rebuildPages();preload();draw()}catch{alert('JSON 格式有误')}};fields.page.onchange=draw;for(const key of ['launchStatus','city','cityEn','tapCount','bar','address'])fields[key].oninput=draw;$('download').onclick=()=>download(Number(fields.page.value));$('downloadAll').onclick=()=>{for(let i=0;i<pageCount();i++)setTimeout(()=>download(i),i*350);setTimeout(()=>{fields.page.value='0';draw()},pageCount()*350+300)};rebuildPages();preload();draw()
  </script>
</body>
</html>
