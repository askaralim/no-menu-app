<body>

          <div class="field"><label>城市英文</label><input id="cityEn" value="CHENGDU"></div>
          <div class="field"><label>当前 Tap</label><input id="tapCount" value="24"></div>

        <div class="field"><label>营业时间</label><input id="hours" value="18:00–02:00"></div>
      </section>
      <section class="group">
        <h2 class="group-title">REAL DATA</h2>
        <div class="field"><label>酒款 JSON</label><textarea id="data"></textarea></div>
        <button class="action" id="apply">应用数据</button>
      </section>
      <section class="group">
        <h2 class="group-title">PREVIEW / EXPORT</h2>
        <div class="field"><label>页面</label><select id="page"></select></div>
        <div class="field"><label>文件名</label><input id="filename" value="no-menu-chengdu-bigfish"></div>
        <div class="actions"><button class="action primary" id="download">下载当前页</button><button class="action" id="downloadAll">下载全部</button></div>
      </section>
    </aside>
    <section class="stage"><div class="frame"><canvas id="canvas" width="1080" height="1440"></canvas></div></section>
  </main>

    const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d'),images=new Map();let data=structuredClone(items)
    const fields={city:$('city'),cityEn:$('cityEn'),tapCount:$('tapCount'),bar:$('bar'),address:$('address'),hours:$('hours'),data:$('data'),page:$('page'),filename:$('filename')};fields.data.value=JSON.stringify(data,null,2)
    function font(size,weight=400,mono=false){return `${weight} ${size}px ${mono?'"SFMono-Regular",Menlo,monospace':'"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'}`}
    function text(s,x,y,size=32,weight=400,color='#171814',align='left',mono=false){ctx.save();ctx.fillStyle=color;ctx.font=font(size,weight,mono);ctx.textBaseline='top';ctx.textAlign=align;ctx.fillText(String(s),x,y);ctx.restore()}
    function fit(s,x,y,w,size,min=16,opt={}){let z=size;ctx.font=font(z,opt.weight||400,opt.mono);while(ctx.measureText(s).width>w&&z>min){z-=2;ctx.font=font(z,opt.weight||400,opt.mono)}text(s,x,y,z,opt.weight||400,opt.color||'#171814',opt.align||'left',opt.mono)}
    function line(x1,y1,x2,y2,color='#171814',width=2){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
    function locationPin(x,y,size,color,bg='#315d61'){ctx.save();ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x,y+size*.58);ctx.bezierCurveTo(x-size*.13,y+size*.35,x-size*.48,y+size*.12,x-size*.48,y-size*.13);ctx.arc(x,y-size*.13,size*.48,Math.PI,0);ctx.bezierCurveTo(x+size*.48,y+size*.12,x+size*.13,y+size*.35,x,y+size*.58);ctx.fill();ctx.fillStyle=bg;ctx.beginPath();ctx.arc(x,y-size*.13,size*.16,0,Math.PI*2);ctx.fill();ctx.restore()}
    function coverImage(img,x,y,w,h){ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();const r=Math.max(w/img.naturalWidth,h/img.naturalHeight),dw=img.naturalWidth*r,dh=img.naturalHeight*r;ctx.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh);ctx.restore()}
    function paper(){ctx.fillStyle='#e8dfcf';ctx.fillRect(0,0,1080,1440);ctx.globalAlpha=.08;for(let y=0;y<1440;y+=12){line(0,y,1080,y,'#171814',1)}ctx.globalAlpha=1}
    function drawCover(){paper();ctx.fillStyle='#315d61';ctx.fillRect(0,0,1080,160);text('NO MENU / 城市酒吧档案',62,54,28,650,'#f1eadf');text(fields.city.value,62,224,124,700,'#171814');ctx.font=font(124,700);const cityWidth=ctx.measureText(fields.city.value).width;text('精酿酒吧',62+cityWidth+34,292,46,650,'#b64b32');text(fields.cityEn.value,68,366,32,650,'#315d61','left',true);line(62,440,1018,440,'#171814',3);fit(fields.bar.value,62,500,956,112,56,{weight:700,color:'#171814'});ctx.fillStyle='#b64b32';ctx.fillRect(62,650,250,12);text(fields.tapCount.value,62,728,142,700,'#b64b32','left',true);text('款当前 TAP',274,814,34,650,'#171814');ctx.fillStyle='#171814';ctx.fillRect(0,1100,1080,340);text(fields.address.value,62,1160,30,650,'#f4efe5');text(`营业时间 ${fields.hours.value}`,62,1222,27,450,'#d0c7b8');text('NO MENU',62,1340,22,600,'#d0c7b8','left',true)}
    function drawBar(){ctx.fillStyle='#315d61';ctx.fillRect(0,0,1080,1440);text('NO MENU',62,58,24,650,'#d9d0c0','left',true);fit(fields.city.value,1018,48,480,42,28,{weight:700,color:'#e8dfcf',align:'right'});line(62,128,1018,128,'#8aa0a0',2);fit(fields.bar.value,62,174,956,82,42,{weight:700,color:'#fff8ed'});text(`${fields.tapCount.value} 款当前 TAP`,62,280,27,600,'#d9d0c0');locationPin(75,348,28,'#d9d0c0');text(fields.address.value,102,330,27,600,'#d9d0c0');const selected=[0,1,2,6,8],cards=[[62,430,450,300],[568,430,450,300],[62,774,300,300],[390,774,300,300],[718,774,300,300]];cards.forEach((c,i)=>{ctx.fillStyle='#d8cdbb';ctx.fillRect(...c);const img=images.get(data[selected[i]]?.image);if(img)coverImage(img,...c)});text('酒款可能随酒吧实时更新',62,1142,24,500,'#d9d0c0');text('NO MENU',62,1312,30,650,'#e8dfcf','left',true)}
    function menuPageCount(){return Math.ceil(data.length/6)}
    function menuPageSize(){return Math.ceil(data.length/menuPageCount())}
    function formatServings(item){return (item.servings||[]).map(s=>{const size=s.label||s.volume_ml?`${s.label||''}${s.label&&s.volume_ml?' · ':''}${s.volume_ml?`${s.volume_ml}ml`:''}`:'';return `${size}${size&&s.price!=null?' ':''}${s.price!=null?`¥${s.price}`:''}`.trim()}).filter(Boolean).join(' / ')}
    function drawMenu(page){paper();const size=menuPageSize(),start=page*size,subset=data.slice(start,start+size);text('NO MENU',62,54,26,650,'#315d61','left',true);text(`${fields.city.value} · ${fields.bar.value}`,1018,58,22,600,'#315d61','right');line(62,118,1018,118,'#315d61',2);text('实时酒单',62,172,54,650);text(`${data.length} TAPS`,1018,190,22,650,'#b64b32','right',true);subset.forEach((item,i)=>{const y=286+i*190;text(String(start+i+1).padStart(2,'0'),62,y+10,22,650,'#b64b32','left',true);const img=images.get(item.image);if(img){coverImage(img,120,y-4,84,84);ctx.strokeStyle='#b8af9f';ctx.lineWidth=1;ctx.strokeRect(120,y-4,84,84)}const country=item.country||breweryCountries[item.brewery];if(country)text(country,228,y-7,15,500,'#777870');fit(`${item.brewery} · ${item.name}`,228,y+22,640,30,18,{weight:650});text(item.abv,1018,y+30,22,650,'#315d61','right',true);fit(item.style,228,y+66,640,22,16,{color:'#5f6059'});const servings=formatServings(item);if(servings)fit(servings,228,y+100,790,20,15,{weight:500,color:'#8a5749',mono:true});line(120,y+143,1018,y+143,'#b8af9f',1)})}
    function pageCount(){return 2+menuPageCount()}
    function rebuildPages(){const requested=Number(new URLSearchParams(location.search).get('page')),current=Number.isFinite(requested)?Math.min(Math.max(requested,0),pageCount()-1):Math.min(Number(fields.page.value)||0,pageCount()-1),menuPages=pageCount()-2;fields.page.innerHTML='';['01 城市封面','02 酒吧与精选',...Array.from({length:menuPages},(_,i)=>`${String(i+3).padStart(2,'0')} 酒单 ${i+1}/${menuPages}`)].forEach((label,i)=>{const option=document.createElement('option');option.value=String(i);option.textContent=label;fields.page.appendChild(option)});fields.page.value=String(current)}
    function draw(){const p=Number(fields.page.value);ctx.clearRect(0,0,1080,1440);if(p===0)drawCover();else if(p===1)drawBar();else drawMenu(p-2)}
    function preload(){let pending=0;for(const item of data){if(!item.image||images.has(item.image))continue;pending+=1;const img=new Image();img.crossOrigin='anonymous';const done=()=>{pending-=1;if(pending===0)document.body.dataset.ready='1';draw()};img.onload=()=>{images.set(item.image,img);done()};img.onerror=done;img.src=item.image}if(pending===0)document.body.dataset.ready='1'}
    function download(p){fields.page.value=String(p);draw();const a=document.createElement('a');a.download=`${fields.filename.value}-${String(p+1).padStart(2,'0')}.png`;a.href=canvas.toDataURL('image/png');a.click()}
    $('apply').onclick=()=>{try{data=JSON.parse(fields.data.value);fields.tapCount.value=String(data.length);images.clear();rebuildPages();preload();draw()}catch{alert('JSON 格式有误')}};fields.page.onchange=draw;for(const key of ['city','cityEn','tapCount','bar','address','hours'])fields[key].oninput=draw;$('download').onclick=()=>download(Number(fields.page.value));$('downloadAll').onclick=()=>{for(let i=0;i<pageCount();i++)setTimeout(()=>download(i),i*350);setTimeout(()=>{fields.page.value='0';draw()},pageCount()*350+300)};rebuildPages();preload();draw()
