<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>No Menu 1.3.2 小红书分享图</title>
  <style>
    :root { --bg:#070806; --paper:#f1eee7; --muted:#aaa294; --gold:#dca13d; --line:#3a3022; }
    * { box-sizing:border-box; }
    html,body { margin:0; background:#171814; color:var(--paper); font-family:"PingFang SC","Helvetica Neue",Arial,sans-serif; }
    .toolbar { position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:14px; padding:14px 20px; background:#111; border-bottom:1px solid #302a22; }
    .toolbar button { padding:9px 16px; border:1px solid #6d542f; border-radius:8px; color:#eee7da; background:#211c15; }
    .toolbar span { color:#928b7f; font-size:13px; }
    #slides { display:grid; justify-content:center; gap:28px; padding:28px; }
    .slide { position:relative; width:1080px; height:1440px; overflow:hidden; background:var(--bg); border:1px solid #29231b; }
    .slide::after { content:""; position:absolute; inset:0; pointer-events:none; opacity:.13; background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px); background-size:100% 5px; }
    .edge { position:absolute; inset:40px; z-index:20; pointer-events:none; border:1px solid rgba(220,161,61,.3); }
    .brand { position:absolute; z-index:16; left:74px; top:68px; color:#d8b46e; font:700 28px/1 Menlo,monospace; letter-spacing:4px; }
    h1,h2,p { margin:0; }
    .gold { color:var(--gold); }
    .phone { position:absolute; overflow:hidden; background:#090a08; border:1px solid #524633; border-radius:30px; box-shadow:0 34px 90px rgba(0,0,0,.65); }
    .phone img { display:block; width:100%; height:100%; object-fit:cover; }

    /* 封面 */
    .cover .visual { position:absolute; top:66px; right:-18px; width:720px; height:1328px; overflow:hidden; border-radius:32px 0 0 32px; }
    .cover .visual img { width:100%; height:100%; object-fit:cover; object-position:50% 45%; }
    .cover .visual::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg,var(--bg) 0%,rgba(7,8,6,.78) 18%,rgba(7,8,6,.05) 66%),linear-gradient(0deg,var(--bg) 0%,transparent 22%); }
    .cover .copy { position:absolute; z-index:12; left:74px; top:250px; width:670px; }
    .cover .near { color:#d8b46e; font-size:34px; line-height:1; letter-spacing:2px; font-weight:650; }
    .cover h1 { margin-top:34px; font-size:92px; line-height:1.13; letter-spacing:-5px; }
    .cover .launch { display:inline-block; margin-top:52px; color:#c4bbac; font-size:22px; }

    /* 附近列表 */
    .nearby .copy { position:absolute; z-index:14; left:690px; top:210px; width:320px; }
    .nearby h2 { font-size:62px; line-height:1.22; letter-spacing:-3px; }
    .nearby .screen { left:66px; top:72px; width:585px; height:1296px; transform:rotate(-.7deg); }

    /* 首页发现 */
    .discover .copy { position:absolute; z-index:14; left:74px; top:155px; }
    .discover h2 { font-size:66px; line-height:1.18; letter-spacing:-3px; }
    .discover .home { left:54px; top:345px; width:525px; height:1030px; transform:rotate(-1.5deg); }
    .discover .event { right:50px; top:405px; width:475px; height:930px; transform:rotate(2deg); }

    /* 分享酒单 */
    .taplist .copy { position:absolute; z-index:14; left:74px; top:145px; }
    .taplist h2 { font-size:65px; line-height:1.18; letter-spacing:-3px; }
    .taplist .sub { margin-top:16px; color:var(--muted); font-size:24px; }
    .taplist .sheet { position:absolute; left:105px; top:385px; width:870px; height:1000px; overflow:hidden; border:1px solid #524633; border-radius:22px; box-shadow:0 30px 80px rgba(0,0,0,.58); background:#090a08; }
    .taplist .sheet img { width:100%; height:100%; object-fit:cover; object-position:top; }
  </style>
</head>
<body>
  <div class="toolbar"><button onclick="window.print()">打印 / 导出</button><span>4 张画布，1080 × 1440；使用 ?slide=1 单张预览。</span></div>
  <main id="slides">
    <section class="slide cover">
      <div class="visual"><img src="../output/xiaohongshu-1.3.2-launch/sources/nearby.png" alt="附近酒吧" /></div>
      <div class="brand">NO MENU</div>
      <div class="copy"><div class="near">附近</div><h1>离今晚<br><span class="gold">更近一点</span></h1><span class="launch">现已上线</span></div>
      <div class="edge"></div>
    </section>

    <section class="slide nearby">
      <div class="phone screen"><img src="../output/xiaohongshu-1.3.2-launch/sources/nearby.png" alt="附近列表" /></div>
      <div class="copy"><h2>附近酒吧<br><span class="gold">按距离排列</span></h2></div>
      <div class="edge"></div>
    </section>

    <section class="slide discover">
      <div class="brand">NO MENU</div>
      <div class="copy"><h2>活动和上新<br><span class="gold">都在今晚首页</span></h2></div>
      <div class="phone home"><img src="../output/xiaohongshu-1.3.2-launch/sources/home.png" alt="今晚首页" /></div>
      <div class="phone event"><img src="../output/xiaohongshu-1.3.2-launch/sources/event-detail.png" alt="活动详情" /></div>
      <div class="edge"></div>
    </section>

    <section class="slide taplist">
      <div class="brand">NO MENU</div>
      <div class="copy"><h2>完整酒单<br><span class="gold">一张图带走</span></h2><p class="sub">枪号、状态、规格和公开价格，一次看清。</p></div>
      <div class="sheet"><img src="../output/xiaohongshu-1.3.2-launch/sources/taplist-share.png" alt="完整酒单分享图" /></div>
      <div class="edge"></div>
    </section>
  </main>
  <script>
    const n = Number(new URLSearchParams(location.search).get('slide'))
    if (n) {
      document.querySelector('.toolbar').remove()
      document.body.style.background = '#070806'
      document.querySelector('#slides').style.padding = '0'
      document.querySelectorAll('.slide').forEach((slide, index) => slide.style.display = index === n - 1 ? 'block' : 'none')
    }
  </script>
</body>
</html>
