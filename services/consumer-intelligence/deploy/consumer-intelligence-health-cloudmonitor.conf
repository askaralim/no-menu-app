# Install as /etc/systemd/system/consumer-intelligence-health.service.d/cloudmonitor.conf
# only after upload succeeds, account billing is confirmed, and the alert rule
# includes both unhealthy values and missing-data handling.
[Service]
Environment=CI_CLOUDMONITOR_ROLE=nomenu-media-ecs
ExecStart=
ExecStart=/usr/bin/python3 deploy/report-health.py
TimeoutStartSec=50
MemoryMax=192M
# CLI reads its default profile before processing --config-path. Expose only
# this credential-free file in a private home mount; keep real homes hidden.
ProtectHome=tmpfs
BindReadOnlyPaths=/opt/no-menu/consumer-intelligence/deploy/cloudmonitor-cli.json:/home/nomenu-ci/.aliyun/config.json
