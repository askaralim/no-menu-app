# Review and include in the existing HTTPS server only after staging acceptance.
# Does not change /api/taplist, /api/supabase or any static/frontend location.
location ~ ^/api/(feed|consumer|analytics)/v1/ {
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8791;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_next_upstream off;
    # Avoid existing access formats recording full query strings/identifiers.
    # API emits sanitized requestId/route/status/timing logs instead.
    access_log off;
}
