# Trial acceptance only: include inside the existing nomenuapp.com HTTPS server.
# The trial client may read Feed. Profile and operational endpoints remain private.
location = /api/feed/v1/new-beers {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8791;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
    proxy_next_upstream off;
    access_log off;
}

location ~ ^/api/analytics/v1/(identity-operations|events/batch)$ {
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8791;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
    proxy_next_upstream off;
    access_log off;
}

location = /api/consumer/v1/cities {
    proxy_pass http://127.0.0.1:8791;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
    proxy_next_upstream off;
    access_log off;
}
