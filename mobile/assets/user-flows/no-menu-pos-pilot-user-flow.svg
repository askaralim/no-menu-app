<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">No Menu POS pilot user flow</title>
  <desc id="desc">A role-based user flow for the No Menu POS pilot upgrade, showing staff service, owner taplist management, and consumer sync.</desc>
  <defs>
    <style>
      .bg { fill: #07100c; }
      .panel { fill: #0e1913; stroke: #1f392b; stroke-width: 2; }
      .lane { fill: #111f18; stroke: #294432; stroke-width: 2; }
      .card { fill: #18261d; stroke: #355842; stroke-width: 2; }
      .card2 { fill: #152119; stroke: #4f7a5d; stroke-width: 2; }
      .start { fill: #93df76; stroke: #baf59c; stroke-width: 2; }
      .system { fill: #102922; stroke: #57b89b; stroke-width: 2; }
      .warn { fill: #2a2112; stroke: #d4af37; stroke-width: 2; }
      .text { fill: #f5f1e6; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
      .muted { fill: #a6b8aa; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
      .dark { fill: #07100c; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; font-weight: 800; }
      .green { fill: #93df76; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; font-weight: 800; }
      .small { font-size: 24px; }
      .body { font-size: 28px; }
      .label { font-size: 30px; font-weight: 800; }
      .title { font-size: 58px; font-weight: 900; letter-spacing: 0; }
      .subtitle { font-size: 28px; }
      .arrow { stroke: #93df76; stroke-width: 5; fill: none; marker-end: url(#arrowhead); }
      .arrow-muted { stroke: #6d8f73; stroke-width: 4; fill: none; marker-end: url(#arrowhead-muted); }
      .dash { stroke-dasharray: 10 12; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#93df76"/>
    </marker>
    <marker id="arrowhead-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#6d8f73"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1050"/>
  <rect class="panel" x="42" y="38" width="1516" height="974" rx="28"/>

  <text class="text title" x="86" y="112">No Menu POS pilot user flow</text>
  <text class="muted subtitle" x="88" y="154">Keep staff thin. Give owners a taplist remote control: 上新 / 改价 / 售罄 / 预览.</text>

  <rect class="lane" x="80" y="205" width="1440" height="192" rx="22"/>
  <text class="green label" x="112" y="253">Phase 0: pilot-ready login and tenant context</text>

  <rect class="start" x="118" y="286" width="238" height="78" rx="18"/>
  <text class="dark body" x="154" y="333">打开 No Menu POS</text>

  <rect class="card" x="430" y="286" width="246" height="78" rx="18"/>
  <text class="text body" x="474" y="333">登录门店账号</text>

  <rect class="card2" x="748" y="286" width="302" height="78" rx="18"/>
  <text class="text body" x="787" y="319">看到当前门店</text>
  <text class="muted small" x="792" y="350">酒吧名 / 角色 / 状态</text>

  <rect class="warn" x="1124" y="286" width="322" height="78" rx="18"/>
  <text class="text body" x="1168" y="319">隐藏开放注册</text>
  <text class="muted small" x="1170" y="350">新门店联系 No Menu 开通</text>

  <path class="arrow" d="M 356 325 H 430"/>
  <path class="arrow" d="M 676 325 H 748"/>
  <path class="arrow-muted" d="M 1050 325 H 1124"/>

  <rect class="lane" x="80" y="440" width="690" height="420" rx="22"/>
  <text class="green label" x="112" y="490">Staff service flow</text>
  <text class="muted small" x="113" y="524">Staff tabs: 点单 / 订单 / 更多</text>

  <rect class="card" x="120" y="560" width="250" height="88" rx="18"/>
  <text class="text body" x="160" y="596">点单</text>
  <text class="muted small" x="160" y="628">创建 / 编辑订单</text>

  <rect class="card" x="482" y="560" width="250" height="88" rx="18"/>
  <text class="text body" x="522" y="596">结账</text>
  <text class="muted small" x="522" y="628">checkout / finished</text>

  <rect class="card" x="120" y="712" width="250" height="88" rx="18"/>
  <text class="text body" x="160" y="748">订单</text>
  <text class="muted small" x="160" y="780">当日流水 / 历史</text>

  <rect class="card2" x="482" y="712" width="250" height="88" rx="18"/>
  <text class="text body" x="522" y="748">更多</text>
  <text class="muted small" x="522" y="780">账号 / 退出 / 基础信息</text>

  <path class="arrow" d="M 370 604 H 482"/>
  <path class="arrow-muted" d="M 607 648 V 712"/>
  <path class="arrow-muted" d="M 370 756 H 482"/>

  <rect class="lane" x="830" y="440" width="690" height="420" rx="22"/>
  <text class="green label" x="862" y="490">Owner taplist flow</text>
  <text class="muted small" x="863" y="524">Owner tabs: 点单 / 订单 / 酒单 / 门店</text>

  <rect class="card" x="870" y="560" width="250" height="88" rx="18"/>
  <text class="text body" x="910" y="596">酒单</text>
  <text class="muted small" x="910" y="628">当前酒款列表</text>

  <rect class="card" x="1232" y="560" width="250" height="88" rx="18"/>
  <text class="text body" x="1272" y="596">更新状态</text>
  <text class="muted small" x="1272" y="628">上新 / 在售 / 售罄</text>

  <rect class="card" x="870" y="712" width="250" height="88" rx="18"/>
  <text class="text body" x="910" y="748">公开酒单价</text>
  <text class="muted small" x="910" y="780">杯型 / 容量 / 价格</text>

  <rect class="card2" x="1232" y="712" width="250" height="88" rx="18"/>
  <text class="text body" x="1272" y="748">预览并发布</text>
  <text class="muted small" x="1272" y="780">打开消费者页面</text>

  <path class="arrow" d="M 1120 604 H 1232"/>
  <path class="arrow-muted" d="M 1357 648 V 712"/>
  <path class="arrow-muted" d="M 1120 756 H 1232"/>

  <rect class="system" x="270" y="900" width="1060" height="78" rx="20"/>
  <text class="text body" x="326" y="948">Supabase public RPCs update No Menu consumer app: TONIGHT feed, bar detail, beer detail</text>

  <path class="arrow-muted dash" d="M 607 800 C 607 860, 470 860, 470 900"/>
  <path class="arrow dash" d="M 1357 800 C 1357 860, 1120 860, 1120 900"/>

  <text class="muted small" x="86" y="1000">First build slice: Phase 0 copy cleanup + owner-only 酒单 tab + public status/visibility updates + preview link.</text>
</svg>
